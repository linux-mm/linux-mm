name: MM Host Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  host-tests:
    name: Run MM host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git clone --depth 2 "$REPO_URL" linux
          cd linux
          git checkout "${GITHUB_SHA}"
          echo "Checked out $(git rev-parse HEAD)"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential

      - name: Run memblock tests
        run: bash .github/scripts/run-memblock-tests.sh
        working-directory: linux

      - name: Run radix-tree tests
        run: bash .github/scripts/run-radix-tree-tests.sh
        working-directory: linux

      - name: Run VMA tests
        run: bash .github/scripts/run-vma-tests.sh
        working-directory: linux
