name: MM Host Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  host-tests:
    name: Run MM host tests
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        run: bash .github/scripts/checkout.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINUX_TREE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        working-directory: linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential libasan6 liburcu-dev

      - name: Run memblock tests
        run: bash .github/scripts/run-memblock-tests.sh
        working-directory: linux

      - name: Run radix-tree tests
        run: bash .github/scripts/run-radix-tree-tests.sh
        working-directory: linux

      - name: Run VMA tests
        run: bash .github/scripts/run-vma-tests.sh
        working-directory: linux
