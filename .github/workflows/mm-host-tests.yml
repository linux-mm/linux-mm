name: MM Host Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  host-tests:
    name: Run MM host tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [self-hosted, ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          MIRROR_PATH="/mirror/linux.git"
          LINUX_TREE_REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          
          rm -rf linux
          
          if [ -d "$MIRROR_PATH" ]; then
              echo "Using local mirror at $MIRROR_PATH"
              git clone --depth 2 --reference "$MIRROR_PATH" "$REPO_URL" linux
          else
              echo "Cloning from $REPO_URL"
              git clone --depth 2 "$REPO_URL" linux
          fi
          
          cd linux
          git fetch origin "$LINUX_TREE_REF"
          git checkout "$LINUX_TREE_REF"
          echo "Checked out $(git rev-parse HEAD)"

      - name: Install dependencies
        working-directory: linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential libasan6 liburcu-dev

      - name: Run memblock tests
        run: bash .github/scripts/run-memblock-tests.sh
        working-directory: linux

      - name: Run radix-tree tests
        run: bash .github/scripts/run-radix-tree-tests.sh
        working-directory: linux

      - name: Run VMA tests
        run: bash .github/scripts/run-vma-tests.sh
        working-directory: linux
