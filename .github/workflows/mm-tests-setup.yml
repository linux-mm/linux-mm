name: MM Tests Setup

on:
  workflow_call:  # Makes this workflow reusable
    inputs:
      install_vm_deps:
        description: 'Install VM testing dependencies (vng, kernel build tools)'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup test environment
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          MIRROR_PATH="/mirror/linux.git"
          LINUX_TREE_REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          
          rm -rf linux
          
          if [ -d "$MIRROR_PATH" ]; then
              echo "Using local mirror at $MIRROR_PATH"
              git clone --depth 2 --reference "$MIRROR_PATH" "$REPO_URL" linux
          else
              echo "Cloning from $REPO_URL"
              git clone --depth 2 "$REPO_URL" linux
          fi
          
          cd linux
          git fetch origin "$LINUX_TREE_REF"
          git checkout "$LINUX_TREE_REF"
          echo "Checked out $(git rev-parse HEAD)"

      - name: Install host test dependencies
        working-directory: linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential libasan6 liburcu-dev

      - name: Install VM test dependencies
        if: inputs.install_vm_deps
        working-directory: linux
        run: |
          sudo apt-get install -qq -y flex bison libelf-dev bc
          command -v pipx > /dev/null 2>&1 || sudo apt-get install -qq -y pipx
          pipx list | grep -q virtme-ng || pipx install virtme-ng
