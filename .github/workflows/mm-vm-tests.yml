name: MM VM Tests

on:
  # push:
  #   branches: ['**']
  # pull_request:
  #   branches: ['**']
  workflow_dispatch:

jobs:
  setup:
    name: Setup environment
    uses: ./.github/workflows/mm-tests-setup.yml
    with:
      install_vm_deps: true

  vm-tests:
    name: Run MM VM tests
    needs: setup
    runs-on: self-hosted

    steps:
      - name: Run VM tests
        run: bash .github/scripts/run-vm-tests.sh
        working-directory: linux
